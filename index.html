			color: #f005;
			content: "";
			display: block;
			position: absolute;
			width:  1em;

<body>
	
	<div id="grid">
		<div class="vertex"/>
	</div>
	
	<script type="module">
		import Angle from "./angle.mjs";
		import Point from "./point.mjs";
		
		const vertex = document.querySelector(".vertex");
		const angle = new Angle(90 * Math.PI / 180);
		angle.callbacks.add(({from, to}) => {
			vertex.style.transform = `rotate(${angle.radians}rad)`;
		});
		const pos = new Point();
		pos.callbacks.add(({from, to}, prop) => {
			if(~"xyz".indexOf(prop))
				vertex.style.setProperty(`--${prop}`, to + "px");
		});
		pos.set(2, 3);
		globalThis.angle = angle;
		globalThis.pos = pos;
	</script>
	
</body>
