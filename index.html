<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="initial-scale=1, minimum-scale=1" />
<title></title>
<style>
	html{
		padding: 4em;
	}
	#thing{
		background: #f00;
		width: 4em;
		height: 1px;
		position: relative;
		transform-origin: 0 0;
	}
		#thing::before{
			content: "";
			width: 1em;
			height: 1em;
			font-size: .5em;
			background: #700;
			display: block;
			position: absolute;
			border-radius: 50%;
			margin: -.5em 0 0 -.5em;
		}
</style>
</head>

<body>
	
	<div id="thing"></div>
	
	<script type="module">
		import Angle from "./angle.mjs";
		
		function degToRad(value){
			return value * Math.PI / 180;
		}
		
		globalThis.angle = new Angle(degToRad(90));
		angle.callbacks.add(change => {
			const {from, to} = change;
			document.getElementById("thing").style.transform = `rotate(${angle.toCSS()})`;
		});
	</script>
	
</body>
</html>
